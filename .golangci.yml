version: "2"
linters:
  # all available linters as of golangci-lint 2.13.1
  default: none
  enable:
    # enabled by default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # disabled by default
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - tagalign
    - tagliatelle
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    # disabled
    # - arangolint # not using ArangoDB
    # - clickhouselint # not using ClickHouse
    # - decorder # declaration order is ordering based on keywords (const, var, etc.)
    # - depguard # not using allow/deny lists of external packages
    # - err113 # want sticky errors
    # - exhaustruct_v5 # use constructors to handle empty fields instead of tags
    # - funcorder # function/method ordering churn
    # - ginkgolinter # not using ginkgo
    # - gochecknoglobals # globals are ok
    # - gochecknoinits # init() is ok
    # - godoclint # doc coverage not enforced
    # - godot # comments without periods are fine
    # - goheader # not using a header
    # - gomodguard_v2 # not using allow/deny lists of external packages
    # - gosmopolitan # not using i18n
    # - grouper # forces grouping structs, even if they're multi-line
    # - importas # needs custom configurations, to handle imports like k8s v1alpha1 type conflicts
    # - ireturn # return interfaces are fine
    # - loggercheck # not using these log libs
    # - mnd # magic numbers are ok
    # - nlreturn # don't need newline before return
    # - noinlineerr # inline errors are idiomatic
    # - nolintlint # nolint directives are fine
    # - paralleltest # not making every test parallel
    # - promlinter # not using prometheus
    # - protogetter # not using protobuf-generated code
    # - rowserrcheck # not using database/sql
    # - spancheck # not using OpenTelemetry
    # - sloglint # no using direct slog calls
    # - sqlclosecheck # not using database/sql
    # - testableexamples # no output comments are ok
    # - testpackage # _test packages are preferred
    # - thelper # no need to clean up call stack for tests
    # - unqueryvet # not using SQL, SELECT * is fine anyway
    # - varnamelen # short names are fine
    # - wrapcheck # don't want to always wrap errors
    # - wsl_v5 # too strict whitespace stuff
    # - zerologlint # not using zerolog

  settings:
    lll:
      # Max line length, lines longer will be reported.
      # '\t' is counted as 1 character by default, and can be changed with the tab-width option.
      # Default: 120.
      line-length: 150
      # Tab width in spaces.
      # Default: 1
      tab-width: 1
    cyclop:
      # The maximal code complexity to report.
      # Default: 10
      max-complexity: 16
    errorlint:
      # Check for plain error comparisons.
      # Default: true
      comparison: false
    exhaustive:
      # a switch with a default case is exhaustive: listing every reflect.Kind to
      # "return v" for scalars would be noise
      default-signifies-exhaustive: true
    forbidigo:
      # print through pkg/util/log, never fmt/print/slog directly
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^(slog\.(Debug|Info|Warn|Error)(Context)?|slog\.Default)$
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake

  exclusions:
    # golangci has its own rules to ignore certain lint rules. See `golangci-lint run --help`.
    generated: lax
    rules:
      # I like my zeros
      - text: "var-declaration: should drop = 0 from declaration of var"
        linters:
          - revive
      # easier to manipulate, even if longer
      - text: "if-return: redundant if ...; err != nil check, just return error instead"
        linters:
          - revive
      # tests repeat literals freely; named constants obscure the fixtures
      - path: _test\.go
        linters:
          - goconst
      # test tables read long; the fixture rows dominate the line count
      - path: _test\.go
        linters:
          - funlen
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      # Section configuration to compare against.
      # Section names are case-insensitive and may contain parameters in ().
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/s12chung/ccbox) # Custom section: groups all imports with the specified Prefix.
  # disabled
  # - gofmt # gofumpt is stricter
  # - golines # lines stay under lll's limit by hand
  # - swaggo # not using swagger

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

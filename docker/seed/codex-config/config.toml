default_permissions = "ccbox"

[permissions.ccbox]
extends = ":workspace" # writable in workspace, read-only elsewhere

[permissions.ccbox.filesystem]
glob_scan_max_depth = 4 # depth for the unbounded **/ deny globs below

# Secret paths denied; .ccbox.yaml read-only
[permissions.ccbox.filesystem.":workspace_roots"]
"**/*.env" = "deny"
"**/.env.*" = "deny"
"**/.envrc" = "deny"
"secrets/**" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
".ccbox.yaml" = "read"
".ccbox.local.yaml" = "read"

# Managed-policy CLAUDE.md — Codex has no /etc/claude-code equivalent
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "cat /etc/claude-code/CLAUDE.md"

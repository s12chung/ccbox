# The wall's static configs: the listen IP is the egress wall's parent-side
# veth; the filter, the host-rendered allow file.
#
# ConnectPort could restrict ports — rejected: complete design decision.
Port 8888

Listen 169.254.100.1
Filter "/etc/ccbox/proxy/allow.txt"
LogLevel Info

FilterDefaultDeny Yes
FilterType ere

# No per-client knob exists, so these are the wedge mitigation — the real
# per-source fix was decided against: it takes netfilter (against the pure
# iproute2 design) or per-session identity.
Timeout 120
MaxClients 300

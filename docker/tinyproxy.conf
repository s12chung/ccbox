# The egress wall's static configs: the listen IP is its own address — the
# target of the devbox's proxy env; the filter, the host-rendered allow file.
#
# ConnectPort could restrict ports — rejected: the allowlist alone decides access.
Port 8888

Listen 169.254.100.1
Filter "/etc/ccbox/proxy/allow.txt"
LogLevel Info

FilterDefaultDeny Yes
FilterType ere

# No per-client knob exists, so these blunt a client exhausting the server's
# connections — the per-source fix was decided against: it takes netfilter or
# per-session identity, against the pure iproute2 design.
Timeout 120
MaxClients 300

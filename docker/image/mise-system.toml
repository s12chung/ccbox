# System toolchain — shared by all users (COPY'd to /etc/mise/config.toml).

[tools]
# Language runtimes
go     = "1.26"
ruby   = "3.4"
python = "3.13"

# Dev-workflow CLIs
ripgrep = "15.1.0"
fd      = "10.4.2"
jq      = "1.8.1"
yq      = "4.53.3"
gh      = "2.94.0"
delta   = "0.19.2"

# Test + lint tooling
bats       = "1.13.0"
hadolint   = "2.14.0"
shellcheck = "0.11.0"

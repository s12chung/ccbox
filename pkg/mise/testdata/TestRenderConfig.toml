# System toolchain — shared by all users (COPY'd to /etc/mise/config.toml).

[tools]
# generated by your config
# ccbox:tools-begin
go = "1.26"
python = { version = "3.13", postinstall = "python -m pip install setuptools==82.0.1 wheel==0.47.0" }
# ccbox:tools-end

# The box's apt libs — installed at image build by `mise bootstrap packages apply`.
[bootstrap.packages]
# generated by your config
# ccbox:packages-begin
"apt:libatomic1" = "latest"
"apt:libyaml-0-2" = "latest"
# ccbox:packages-end
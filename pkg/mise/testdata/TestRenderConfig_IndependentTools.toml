# System toolchain — shared by all users (COPY'd to /etc/mise/config.toml).

[tools]
# generated by your config
# ccbox:tools-begin
bats = "1.14"
hadolint = "2.15"
# --vnc flag uses this chromium as a browser
"npm:playwright" = { version = "1.64", postinstall = "playwright install-deps chromium && playwright install chromium" }
# Dev-workflow CLIs
ripgrep = "15.2"
jq = "1.8"
yq = "4.54"
shellcheck = "0.11"
# ccbox:tools-end


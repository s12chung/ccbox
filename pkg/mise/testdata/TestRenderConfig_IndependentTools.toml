# System toolchain — shared by all users (COPY'd to /etc/mise/config.toml).

[tools]
# generated by your config
# ccbox:tools-begin
bats = "1.13.0"
hadolint = "2.14.0"
# --vnc flag uses this chromium as a browser
"npm:playwright" = { version = "latest", postinstall = "playwright install-deps chromium && playwright install chromium" }
# ccbox:tools-end

# Dev-workflow CLIs
ripgrep    = "15.1.0"
jq         = "1.8.1"
yq         = "4.53.3"
shellcheck = "0.11.0"
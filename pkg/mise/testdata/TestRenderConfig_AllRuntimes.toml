# System toolchain — shared by all users (COPY'd to /etc/mise/config.toml).

[tools]
# generated by your config
# ccbox:tools-begin
go = "1.26"
golangci-lint = "2.13.1"
node = "26.3.0"
python = { version = "3.13", postinstall = "python -m pip install --no-cache-dir setuptools==82.0.1 wheel==0.47.0" }
ruby = "3.4"
# ccbox:tools-end

# Dev-workflow CLIs
ripgrep    = "15.1.0"
jq         = "1.8.1"
yq         = "4.53.3"
shellcheck = "0.11.0"

# The box's apt libs — installed at image build by `mise bootstrap packages apply`.
[bootstrap.packages]
# generated by your config
# ccbox:packages-begin
"apt:libatomic1" = "latest"
"apt:libffi8" = "latest"
"apt:libgmp10" = "latest"
"apt:libreadline8t64" = "latest"
"apt:libssl3t64" = "latest"
"apt:libyaml-0-2" = "latest"
"apt:libzstd1" = "latest"
"apt:zlib1g" = "latest"
# ccbox:packages-end
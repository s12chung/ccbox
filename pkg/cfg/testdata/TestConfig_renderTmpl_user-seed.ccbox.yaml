# Run `ccbox config` to see the effective config — arrays and maps merge down scoped configs.
# Commented reference: https://github.com/s12chung/ccbox/blob/main/docs/config_commented.yaml

cli: pi@latest

images:
  base: debian:trixie-20250113-slim
  mise: ghcr.io/jdx/mise:2026.10.12

# default_variant:
#   port_bindings:
#     tcp: "3000,8000,5173"
# host_gateway:
#   tcp: "5432"

tmpfs_masks:
  - .idea
  - .vscode
  - .zed
volume_masks:
  - node_modules
  - .venv
  - target
read_only_globs: [
  .ccbox.yaml, secrets,
  .env, .env.*, .envrc,
  '**/*.pem', '**/*.key', '**/id_rsa*',
]

read_only_binds:
  gitconfig: enabled # special value that binds the XDG git config dir
  # ~/.aws: ~/.aws
  # /srv/ca: /home/ccbox/.local/share/ca

forward_env:
  - TERM
  - COLORTERM
  # - GH_TOKEN

proxy:
  enabled: true
  allowlist:
    - ccbox-defaults # shared tooling domains
    - ccbox-all-runtimes # every runtime's domains (node, python, go, rust)
    - ccbox-set-harness # the selected CLI's — and on --vnc, the GUI app's
    # - ccbox-anthropic-provider # anthropic's API domains (also ccbox-openai-provider, xai, zai, etc.)
    # - ccbox-all-providers # every provider's domains
    # - example.com

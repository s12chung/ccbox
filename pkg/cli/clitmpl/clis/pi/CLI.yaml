# Pi (Earendil Works).
npm:
  package: "@earendil-works/pi-coding-agent"

config_home_mount: ".pi/agent"

cmd: "pi"
continue_args: "-c"
# No picker flag: bare --session errors, so -r needs a session id.
resume_args: "--session"

env:
  PI_SKIP_VERSION_CHECK: "1"

allow_domains:
  - pi.dev
  - radius.pi.dev

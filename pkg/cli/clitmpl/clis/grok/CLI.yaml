# Grok Build (xAI).
version_url:
  url: "https://x.ai/cli/stable"
  download_template:
    x64_url: "https://x.ai/cli/grok-$version-linux-x86_64"
    arm64_url: "https://x.ai/cli/grok-$version-linux-aarch64"

config_home_mount: ".grok"

cmd: "grok"
continue_args: "-c"
# Bare --resume resumes the most recent session — no picker flag exists.
resume_args: "--resume"
env:
  GROK_DISABLE_AUTOUPDATER: "1"

allow_domains:
  - ccbox-xai-provider # x.ai also serves the CLI's own downloads
  - cli-chat-proxy.grok.com
  - code.grok.com
  - assets.grok.com

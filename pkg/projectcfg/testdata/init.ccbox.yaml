# Run `ccbox config` to see effective config

# cli: which coding CLI the image installs and launches
cli:

# host_git_config: read-only mount the host's ~/.config/git
host_git_config:

# tmpfsMasks: project-relative paths to mask with a temporary filesystem to block access.
# Works for files too. Paths that do not exist in the project are safely ignored.
tmpfsMasks:
  # - dist

# volumeMasks: project-relative paths to mask with a persistent volume to avoid host collisions.
# Useful for node_modules-like folders. Paths that do not exist in the project are safely ignored.
volumeMasks:
  # - vendor/bundle

# env: extra environment variables set in the container
env:
  # FOO: bar

# allowlist: domains the egress wall lets through. Each entry also matches all its subdomains
allowlist:
  # - example.com

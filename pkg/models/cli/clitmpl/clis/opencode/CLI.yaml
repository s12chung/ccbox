# OpenCode (Anomaly).
npm:
  package: "opencode-ai"

config_home_mount: ".config/opencode"

cmd: "opencode"
continue_args: "-c"
# No picker flag exists; bare --session errors, so -r needs a session id.
resume_args: "--session"

setup:
  env:
    OPENCODE_DISABLE_AUTOUPDATE: "1"
  data_binds:
    .local/share/opencode/auth.json: "{}"

  proxied:
    allow_domains:
      - ccbox-all-providers
      - opencode.ai
      - models.dev
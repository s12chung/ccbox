[cli]
auto_update = false

[permission]
# secret reads stay denied
deny = [
  "Read(**/.env)",
  "Read(**/.env.*)",
  "Read(**/.envrc)",
  "Read(secrets/**)",
  "Read(**/*.pem)",
  "Read(**/*.key)",
]

# Soft tripwire over Bash
ask = [
  "Bash(*.env*)", # .env / .env.* / .envrc (also ".environment" etc)
  "Bash(*secrets/*)",
  "Bash(*.pem*)",
  "Bash(*.key*)",
  "Bash(*.aws/*)",
  "Bash(*.ssh/*)",
]
